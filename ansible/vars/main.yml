---
# Homebrew packages used on any machine
homebrew_packages:
  - actionlint
  - ansible
  - ansible-lint
  - asitop
  - FelixKratz/formulae/borders
  - btop
  - clang-format
  - coreutils
  - eza
  - fd
  - fzf
  - gcc
  - git
  - gh
  - htop
  - lazygit
  - lua
  - jq
  - make
  - markdownlint-cli2
  - mas
  - neovim
  - pre-commit
  - pyenv
  - rbenv
  - ripgrep
  - shellcheck
  - shfmt
  - FelixKratz/formulae/sketchybar
  - swiftly
  - swiftformat
  #- swiftlint # disabled by default, requires full Xcode installation
  - tmux
  - tree-sitter-cli
  - unzip
  - vim
  - yamllint
  - zsh

# Mac apps via cask
# Cask apps will be installed with --force, overwriting any existing
# application in `/Applications`
homebrew_cask_apps:
  - aerospace
  - betterdisplay
  - bezel
  - chatgpt
  - coteditor
  #- crossover
  - devutils
  #- discord
  - figma
  - firefox
  #- little-snitch # install manually, requires license to older version
  - keka
  - markedit
  - meetingbar
  - microsoft-auto-update
  - microsoft-teams
  - miro
  - proxyman
  - rocket
  - stats
  - time-out
  - tower
  - visual-studio-code
  #- vlc
  #- windows-app

# Fonts to install via Homebrew
# Discover available fonts by running `brew search font-`
homebrew_cask_fonts:
  - font-fira-code
  - font-hack-nerd-font
  - font-ibm-plex-mono
  - font-meslo-lg-nerd-font

# Mac apps via App Store (brew mas)
# This assumes you have already purchased (or get as free) the apps with your Apple ID.
# You will be prompted to log in to App Store with your Apple ID if not already.
# If you have not purchased the app, this will fail.
homebrew_mas_apps:
  - 1440147259 # AdGuard for Safari Extension
  - 640199958 # Apple Developer
  - 1452453066 # Hidden Bar
  - 775737590 # iA Writer
  - 409183694 # Keynote
  - 441258766 # Magnet
  #- 823766827  # Microsoft OneDrive
  #- 784801555  # Microsoft OneNote
  - 409203825 # Numbers
  - 409201541 # Pages
  - 899247664 # TestFlight
  - 904280696  # Things 3
  - 1607635845 # Velja

# Packages, casks and mas apps specific to this machine only. Defaults are
# empty here; a machine can populate them via an untracked
# ~/.config/local/ansible-vars.yml (see local/ansible-vars.yml for the
# template and local/README.txt for details).
homebrew_local_packages: []
homebrew_local_cask_apps: []
homebrew_local_mas_apps: []
